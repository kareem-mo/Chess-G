<!doctype html>
<html>
  <head>
    <title>Chess Move Suggester</title>
    <style>
      body {
        width: 256px;
        padding: 16px;
        background: white;
        color: black;
      }
      h1 {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 16px;
      }
      .space-y-4 > * + * {
        margin-top: 16px;
      }
      label {
        display: block;
        font-size: 14px;
        font-weight: 500;
        margin-bottom: 4px;
      }
      select {
        width: 100%;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
        background: white;
      }
      #position,
      #suggestion {
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 14px;
      }
      #position {
        background: #f5f5f5;
        font-family: monospace;
      }
      #suggestion {
        background: #000;
        color: white;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>Chess Move Suggester</h1>

    <div class="space-y-4">
      <div>
        <label>Depth Level</label>
        <select id="depth">
          <option value="10">Easy (Depth 10)</option>
          <option value="15">Medium (Depth 15)</option>
          <option value="20">Hard (Depth 20)</option>
        </select>
      </div>

      <div>
        <label>Current Position</label>
        <div id="position">Waiting...</div>
      </div>

      <div>
        <label>Suggested Move</label>
        <div id="suggestion">Analyzing...</div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
