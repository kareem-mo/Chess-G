<!doctype html>
<html>
  <head>
    <title>Chess Move Suggester</title>
    <link href="../src/index.css" rel="stylesheet" />
  </head>
  <body class="w-64 p-4 bg-background text-foreground">
    <h1 class="text-lg font-bold mb-4">Chess Move Suggester</h1>

    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">Depth Level</label>
        <select id="depth" class="w-full p-2 border rounded bg-background">
          <option value="10">Easy (Depth 10)</option>
          <option value="15">Medium (Depth 15)</option>
          <option value="20">Hard (Depth 20)</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Current Position</label>
        <div
          id="position"
          class="p-2 border rounded bg-muted text-sm font-mono"
        >
          Waiting...
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Suggested Move</label>
        <div
          id="suggestion"
          class="p-2 border rounded bg-primary text-primary-foreground font-bold"
        >
          Analyzing...
        </div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
